{% extends "intelligence/layout.html" %}{% block app %}<h1>Content</h1><form method="get"><label for="q">Search title</label><input id="q" name="q" value="{{ request.GET.q }}"><input type="hidden" name="status" value="{{ request.GET.status }}"><input type="hidden" name="window" value="{{ request.GET.window }}"><button>Search</button></form>{% for record in records %}<article class="card"><h2><a href="{% url 'record-detail' workspace.id record.id %}">{{ record.title }}</a></h2><p>{{ record.status }}</p></article>{% empty %}<section class="card"><h2>No matching permitted content</h2><p>There are no visible records for these filters.</p><a href="{% url 'records' workspace.id %}">Clear filters</a></section>{% endfor %}{% endblock %}
